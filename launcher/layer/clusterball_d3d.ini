; Clusterball Re-Enhanced - settings of the Direct3D 11 renderer.
; The renderer is the file opengl32.dll next to Clusterball.exe: the game only loads a file of that name,
; so the renderer has to carry it - everything it draws goes through Direct3D 11.
; An environment variable CB_<NAME> overrides the value here. The Command Center (ClusterballCC.exe)
; writes the values it shows in its settings; everything else stays as edited here.
[d3d]
; Render resolution in pixels, e.g. 1920x1080 (CB_RES). Empty = the monitor's native resolution.
; In fullscreen a smaller resolution is stretched to the monitor; a window gets this client size (smaller if it does not fit).
Resolution=
; Size the game itself lays out HUD and camera for (CB_GAMERES).
; Empty = 480 lines at the window's aspect (852x480 for 16:9). 640x480 = original 4:3.
; More pixels = smaller HUD and text, e.g. 1280x720 or 1920x1080.
GameResolution=
; Base multiplier for the raw mouse movement the game receives (CB_MOUSE). Lower = less sensitive.
MouseScale=0.35
; 1 = also apply the Windows pointer speed (Control Panel), 0 = ignore it (CB_MOUSEWIN)
MouseFollowWindows=1
; 1 = in the menus the Windows cursor is the mouse: shown instead of the game's arrow, at Windows' speed and free to
; leave the window; only in flight the mouse is captured (CB_NATIVEMOUSE). 0 = the game's own arrow everywhere.
NativeMouse=1
; Mouse wheel as a key press: each notch up/down presses this DirectInput key (CB_WHEELUP, CB_WHEELDOWN; 0 = off).
; The game knows no wheel; the launcher binds the wanted action to F11 (87) and F12 (88).
WheelUp=87
WheelDown=88
; Music from another folder (CB_MUSICDIR, relative to the game folder; empty = the game's own): a file there with the
; name of the one the game asks for (Levels\<venue>.mp3, MUSIC\Intro.mp3, MUSIC\Outro.mp3) is played instead.
; Default: the ClusterForce music the launcher installs; without that folder the game's own plays.
MusicDir=Music\CF 2026
; A replacement for Data.mrg (CB_DATAARCHIVE, relative to the game folder; empty = Data.mrg). The launcher builds one
; with a ClusterForce ball sound in place of the announcer's Ball.wav (and the old blob sounds Ball1-3.wav),
; e.g. clusterforce\Data.ball-standard.mrg.
DataArchive=
; Language of the game's texts (CB_LANGUAGE): en = English (hides Local.mrg, the German texts, from the game; the
; English base texts in Data.mrg take their place), anything else = as the game folder has it. The launcher sets it
; to its own language.
Language=
; 1 = write compat.log and d3d.log next to the game, for finding problems (CB_LOG). Off by default; d3d.log is still
; written when Direct3D 11 cannot start.
Log=0
; 1 = wait for the display refresh, 0 = present immediately (CB_VSYNC)
VSync=1
; Frames the GPU may queue ahead; 1 = lowest input lag (CB_LATENCY)
MaxFrameLatency=1
; Anisotropic texture filtering, 1 = off (CB_ANISO)
Anisotropy=8
; 1 = fullscreen (borderless, covers the monitor), 0 = window, 2 = the game's original display mode switch (CB_FULLSCREEN)
; Alt+Enter switches between fullscreen and window while playing.
Fullscreen=1
; 1 = skip the "mod by xdgn" splash and its extra second (CB_NOSPLASH)
RemoveSplash=1
; 1 = no "mod by xdgn" picture on exit: the game quits without waiting for Esc (CB_SKIPEXIT)
SkipExitScreen=1
; Anti-aliasing samples per pixel: 1 (off), 2, 4, 8 (CB_MSAA)
MSAA=4
; Render internally at N x the window size and filter down: 1 (off), 2 = 4K for a 1080p window (CB_SUPERSAMPLE)
SuperSample=1
; Ambient occlusion from the depth buffer (CB_AO); off by default, the coarse terrain shows its facet edges
AmbientOcclusion=0
AOStrength=0.6
AORadius=200
; Sharpening 0..1 and colour grading (CB_SHARPEN, CB_CONTRAST, CB_SATURATION, CB_GAMMA)
Sharpen=0.5
Contrast=1.05
Saturation=1.1
Gamma=1.0
; High-resolution texture pack: textures\<TexturePack>\<hash>.dds replaces the original (CB_TEXREPLACE, CB_TEXPACK)
TextureReplace=1
; hd = 4x upscaled (textures\hd)
TexturePack=hd
; 1 = write every texture to textures\dump as PNG, input for assets\build_texture_pack.ps1 (CB_TEXDUMP)
; Also dumps the text pictures the game composes at run time (menu titles, "LADE ...", tabs) - one run per language.
TextureDump=0
; Menu/HUD font: 1 = draw textures\font\<hash>.dds (high-resolution atlas) instead of the 8x8 pixel font (CB_FONTREPLACE)
FontReplace=1
; Without a font atlas: 1 = hard pixel edges for the 8x8 font instead of bilinear blur (CB_SHARPFONT)
SharpFont=1
; 1 = 2D pictures sample only inside their own rectangle, no seams or colour-key lines at the edges (CB_UVCLAMP)
EdgeClamp2D=1
